<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F1F3F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1020" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rattrapage">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Rattrapage des prières</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --serif:"Alegreya",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#F1F3F8; --surface:#FFFFFF; --ink:#141A2E; --muted:#5A6379; --line:#DCE1EC; --track:#E3E7F1;
  --primary:#141A2E; --on-primary:#FFFFFF; --danger:#B3321F; --focus:#2F7FD6; --scrim:rgba(10,14,28,.5);
  --c-fajr:#B07AA8; --c-zohr:#3E8EDE; --c-asr:#C9821A; --c-maghreb:#D9503F; --c-icha:#4B509F; --c-witr:#232859;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1020; --surface:#151C31; --ink:#EDF0F8; --muted:#9AA4BC; --line:#263050; --track:#222B47;
    --primary:#EDF0F8; --on-primary:#0B1020; --danger:#FF8A78; --focus:#6DB0FF; --scrim:rgba(0,0,0,.6);
    --c-fajr:#C58FC0; --c-zohr:#5AA4F0; --c-asr:#E0A03C; --c-maghreb:#EE6A58; --c-icha:#7A80DA; --c-witr:#5A5FC8;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#151C31; --ink:#EDF0F8; --muted:#9AA4BC; --line:#263050; --track:#222B47;
  --primary:#EDF0F8; --on-primary:#0B1020; --danger:#FF8A78; --focus:#6DB0FF; --scrim:rgba(0,0,0,.6);
  --c-fajr:#C58FC0; --c-zohr:#5AA4F0; --c-asr:#E0A03C; --c-maghreb:#EE6A58; --c-icha:#7A80DA; --c-witr:#5A5FC8;
}

*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.app{max-width:560px;margin:0 auto;padding:16px 16px 116px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:2px 2px 14px}
.top h1{margin:0;font:700 28px/1.1 var(--serif)}
.top time{font-size:14px;color:var(--muted)}
.h2{font:700 22px/1.2 var(--serif);margin:26px 2px 8px}
.note{margin:0 2px 12px;color:var(--muted);font-size:14px;max-width:62ch}
.boot{padding:90px 0;text-align:center;color:var(--muted)}
.empty{margin:18px 2px;color:var(--muted)}

/* boutons */
.btn{appearance:none;border:1px solid transparent;border-radius:12px;min-height:46px;padding:0 18px;font:600 16px var(--sans)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.wide{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;padding:12px 4px;color:var(--muted);font-size:14.5px;text-decoration:underline}
.link.danger{color:var(--danger)}

/* hero : l'arc du jour */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 14px 16px;text-align:center}
.arc{position:relative;max-width:400px;margin:0 auto}
.arc svg{display:block;width:100%;height:auto}
.arc-track,.arc-fill{fill:none;stroke-width:16}
.arc-track{stroke:var(--track)}
.arc-text{position:absolute;left:0;right:0;bottom:-2px}
.big{font:700 54px/1 var(--serif);font-variant-numeric:lining-nums tabular-nums}
.cap{font-size:14px;color:var(--muted);margin-top:4px}
.hero-sub{margin:14px 0 14px;font-size:14px;color:var(--muted)}
.hero-actions{display:flex;gap:10px;justify-content:center}

/* lignes de prières */
.rows{list-style:none;margin:14px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.row{position:relative;display:grid;grid-template-columns:1fr auto;grid-template-areas:"name rest" "bar bar" "meta act";gap:8px 12px;padding:14px 16px 14px 22px}
.row + .row{border-top:1px solid var(--line)}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.row-name{grid-area:name;font:600 18px var(--sans);align-self:center}
.row-rest{grid-area:rest;display:flex;align-items:baseline;justify-content:flex-end;gap:6px}
.row-rest .num{font:700 28px/1 var(--serif);font-variant-numeric:lining-nums tabular-nums}
.row-rest .lbl{font-size:13px;color:var(--muted)}
.row-rest .fin{font:700 20px/1 var(--serif);color:var(--muted)}
.bar{grid-area:bar;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.row-meta{grid-area:meta;align-self:center;font-size:13px;color:var(--muted)}
.row-meta b{color:var(--ink);font-weight:600}
.row-act{grid-area:act;display:flex;gap:8px}
.plus{min-width:68px;height:46px;border:0;border-radius:12px;background:var(--primary);color:var(--on-primary);font:700 17px var(--sans)}
.minus{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:transparent;font:500 22px var(--sans)}
.minus:disabled{opacity:.35;cursor:default}

/* fin prévue */
.plan{list-style:none;margin:12px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.plan-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px}
.plan-row + .plan-row{border-top:1px solid var(--line)}
.plan-rate{font:600 17px var(--sans)}
.plan-sub{font-size:13px;color:var(--muted)}
.plan-right{text-align:right}
.plan-dur{font:700 22px/1.1 var(--serif);font-variant-numeric:lining-nums}
.plan-date{font-size:13px;color:var(--muted);margin-top:2px}
.pace{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ink);border-radius:20px;padding:14px 18px;margin-top:12px}
.pace-t{font:600 17px var(--sans)}
.pace-s{font-size:13px;color:var(--muted)}
.rate-in{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:14px;color:var(--muted)}
.rate-in input{width:76px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 10px;text-align:center;font:600 17px var(--sans)}
.done{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;margin-top:12px}
.done-big{font:700 30px/1.1 var(--serif);margin-bottom:6px}
.done p{margin:0;color:var(--muted)}

/* historique */
.sum{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.sum div{padding:14px 8px;text-align:center}
.sum div + div{border-left:1px solid var(--line)}
.sum b{display:block;font:700 28px/1.1 var(--serif);font-variant-numeric:lining-nums tabular-nums}
.sum span{font-size:12.5px;color:var(--muted)}
.hist-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 8px}
.hist-head .h2{margin:0}
.days{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.day{width:100%;display:grid;grid-template-columns:1fr auto;grid-template-areas:"date sum" "chips chips";gap:6px 10px;padding:12px 18px;background:none;border:0;text-align:left}
.days li + li .day{border-top:1px solid var(--line)}
.day-date{grid-area:date;font-weight:600}
.day-sum{grid-area:sum;font:700 22px/1 var(--serif);font-variant-numeric:lining-nums}
.day-chips{grid-area:chips;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.more{display:block;margin:12px auto 0}

/* réglages */
.set-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.set-row{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px 12px 22px}
.set-row + .set-row{border-top:1px solid var(--line)}
.set-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.set-row.off .set-name,.set-row.off .num-in{opacity:.5}
.set-name{font-weight:600}
.set-name small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.num-in{width:108px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px;text-align:right;font:600 17px var(--sans)}
.chk{display:flex;padding:6px}
.chk input{width:24px;height:24px;accent-color:var(--primary)}
.add-days{margin-top:14px}
.add-days label{display:block;font-size:14px;color:var(--muted);margin:0 2px 6px}
.add-in{display:flex;gap:10px}
.add-in input{width:120px;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;font:600 17px var(--sans)}

/* première utilisation */
.setup-h{font:700 30px/1.15 var(--serif);margin:28px 2px 10px}
.fields{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:10px;margin:14px 0}
.field span{display:block;font-size:13px;color:var(--muted);margin:0 2px 4px}
.field input{width:100%;height:52px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;font:600 20px var(--sans)}
.check{display:flex;align-items:center;gap:10px;margin:6px 2px 18px}
.check input{width:22px;height:22px;accent-color:var(--primary)}
.setup .link{display:block;margin:10px auto 0}

/* barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs[hidden]{display:none}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{appearance:none;position:relative;background:none;border:0;padding:16px 4px 15px;font:600 14px var(--sans);color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:24%;right:24%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}

/* feuille du bas et message */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));outline:none}
.sheet.enter{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font:700 24px/1.2 var(--serif);margin:4px 0 8px}
.sheet p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.sheet .field{display:block;margin:10px 0}
.sheet .field input[type=date]{height:48px;font:600 17px var(--sans)}
.sheet textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.sheet input[type=file]{margin:10px 0;font-size:14px;max-width:100%}
.steps{list-style:none;margin:10px 0 14px;padding:0}
.step-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 0}
.step-row + .step-row{border-top:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.step-name{font-weight:600;font-size:17px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{min-width:52px;text-align:center;font:700 24px/1 var(--serif);font-variant-numeric:lining-nums tabular-nums}
.sbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;font:500 22px var(--sans)}
.sbtn:disabled{opacity:.35;cursor:default}
.sheet-actions{display:flex;gap:10px}
.sheet-actions .btn{flex:1}
.sheet .center{display:block;margin:6px auto 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);background:var(--primary);color:var(--on-primary);border-radius:12px;padding:11px 16px;font-size:14.5px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.toast[hidden]{display:none}
.toast button{background:none;border:0;padding:4px;font-weight:700;text-decoration:underline;color:inherit}

/* connexion */
.auth-msg{margin:10px 2px 14px;font-size:14px;color:var(--muted);min-height:1.45em}
.auth-msg.err{color:var(--danger)}
.field input:disabled,.btn:disabled{opacity:.6}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<nav id="tabs" class="tabs" hidden aria-label="Sections">
  <div class="tabs-in">
    <button class="tab" data-act="tab" data-tab="log">Rattraper</button>
    <button class="tab" data-act="tab" data-tab="plan">Fin prévue</button>
    <button class="tab" data-act="tab" data-tab="hist">Historique</button>
    <button class="tab" data-act="tab" data-tab="set">Réglages</button>
  </div>
</nav>
<div id="toast" class="toast" role="status" hidden></div>
<div id="sheet-root"></div>

<script src="config.js" charset="utf-8"></script>
<script src="app.js" charset="utf-8"></script>
</body>
</html>
